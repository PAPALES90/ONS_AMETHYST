<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Senin hazırladığın ICO dosyasını bağladık -->
    <link rel="icon" type="image/x-icon" href="ONS-AMETHYST.ico">
    <title>ONS_AMETHYST | Canlı Borsa</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #131722; color: #d1d4dc; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 280px; background-color: #1e222d; border-right: 1px solid #2a2e39; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; font-size: 12px; font-weight: 700; color: #787b86; border-bottom: 1px solid #2a2e39; }
        .item-card { padding: 16px; background-color: #2a2e39; border-left: 4px solid #ab47bc; display: flex; gap: 10px; align-items: center;}
        
        .item-title { font-size: 14px; font-weight: 600; color: #ffffff; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; padding: 15px; }
        .menu-btn { background: transparent; color: #a3a6af; border: none; padding: 12px 15px; text-align: left; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .menu-btn:hover { background: #2a2e39; color: #ffffff; }
        
        /* Kutu Tasarımları */
        .box-container { margin: 0 15px 15px 15px; background: #131722; border: 1px solid #2a2e39; border-radius: 8px; padding: 15px; }
        .box-header { font-size: 12px; font-weight: 700; color: #ffffff; margin-bottom: 10px; border-bottom: 1px solid #2a2e39; padding-bottom: 8px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
        .stat-label { color: #787b86; }
        .stat-val { color: #ffffff; font-weight: 600; }
        
        /* Tavsiye Kutusu */
        .advice-text { font-size: 13px; color: #eebb12; font-weight: 600; font-style: italic; line-height: 1.4; }

        /* Ana İçerik */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .info-header { padding: 20px; border-bottom: 1px solid #2a2e39; display: flex; justify-content: space-between; }
        .current-price { font-size: 32px; font-weight: 800; color: #26a69a; }
        .chart-container { flex: 1; position: relative; padding: 20px; }
        canvas { width: 100% !important; height: 100% !important; }

        /* Animasyonlu Bildirim Balonu (Toast) */
        .toast { position: fixed; top: 20px; right: -350px; background: #2a2e39; border-left: 4px solid #ef5350; color: white; padding: 15px 20px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-weight: bold; font-size: 14px; transition: right 0.4s ease; z-index: 9999; display: flex; align-items: center; gap: 10px;}
        .toast.show { right: 20px; }
    </style>
</head>
<body>

    <!-- Bildirim Sesi (Hazır bir borsa çan sesi) -->
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Kayarak Gelen Bildirim Balonu -->
    <div id="toastMessage" class="toast">⚠️ DİKKAT: PİYASA ÇÖKÜYOR!</div>

    <div class="sidebar">
        <div class="sidebar-header">ONS_AMETHYST MARKET</div>
        
        <div class="item-card">
            <img src="ONS-AMETHYST.ico" width="24" height="24" alt="logo">
            <div>
                <div class="item-title">AMETHYST BLOCK</div>
                <div style="font-size: 11px; color: #787b86;">AMT / IRO</div>
            </div>
        </div>
        
        <div class="sidebar-menu">
            <button class="menu-btn" style="color: #26a69a; background: rgba(38, 166, 154, 0.15);">📊 Canlı Grafik</button>
            <button class="menu-btn" onclick="alert('Cüzdan ve oyun içi senkronizasyon yakında aktif edilecek!')">💼 Cüzdanım (Yakında)</button>
            <button class="menu-btn" onclick="alert('Piyasa ayarları menüsü yapım aşamasında.')">⚙️ Piyasa Ayarları</button>
        </div>

        <div style="flex: 1;"></div>

        <!-- YZ Tavsiyeler Kutusu -->
        <div class="box-container">
            <div class="box-header">YZ TAVSİYESİ 🤖</div>
            <div class="advice-text" id="aiAdvice">Analiz ediliyor...</div>
        </div>

        <!-- İstatistikler Kutusu -->
        <div class="box-container">
            <div class="box-header">İSTATİSTİKLER 🔮</div>
            <div class="stat-row"><span class="stat-label">En Yüksek</span><span class="stat-val" style="color: #26a69a;" id="statHigh">--</span></div>
            <div class="stat-row"><span class="stat-label">En Düşük</span><span class="stat-val" style="color: #ef5350;" id="statLow">--</span></div>
            <div class="stat-row"><span class="stat-label">Hacim</span><span class="stat-val" id="statVol">-- AMT</span></div>
        </div>
    </div>

    <div class="main-content">
        <div class="info-header">
            <div>
                <h1 style="font-size: 20px; color: white;">ONS_AMETHYST / IRON INGOT</h1>
                <span class="current-price" id="priceDisplay">5.00</span>
                <span style="color: #787b86; font-weight: 600;"> DEMİR / ADET</span>
            </div>
        </div>
        <div class="chart-container"><canvas id="onsChart"></canvas></div>
    </div>

    <script>
        const ctx = document.getElementById('onsChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: 30}, (_, i) => `${30 - i}s`),
                datasets: [{ label: 'Fiyat', data: Array(30).fill(5.00), borderColor: '#26a69a', borderWidth: 2, fill: true, backgroundColor: 'rgba(38, 166, 154, 0.1)', tension: 0.3, pointRadius: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#2a2e39' } }, y: { grid: { color: '#2a2e39' } } } }
        });

        const sentences = [
            "Piyasa alev aldı, HERŞEY ARTIYOR HEMEN SAT O AMETİSTİ!",
            "Balinalar demir stokluyor, alım için beklemede kal.",
            "Fiyat diplerde dolaşıyor, dipten toplama zamanı olabilir.",
            "Panik satışı yapma, piyasa her an yukarı dönebilir.",
            "Trend yukarı yönlü, kemerleri bağlayın uçuyoruz!",
            "Riskli sular... Şu an sadece izlemek en iyisi.",
            "Demirlerini hazırla, büyük bir fırsat yaklaşıyor.",
            "Ametist madencileri grevde! Fiyatlar uçabilir.",
            "Piyasada yaprak kımıldamıyor, sabreden yatırımcı kazanır.",
            "Ani çöküş riski var, kârını al ve hemen piyasadan çık!"
        ];

        let lastState = "STABLE";

        // Mesaj Baloncuğu Gösterme Fonksiyonu
        function showToast(message, color) {
            const toast = document.getElementById('toastMessage');
            const sound = document.getElementById('alertSound');
            
            toast.innerHTML = message;
            toast.style.borderLeftColor = color;
            toast.classList.add('show');
            sound.play().catch(e => console.log("Ses oynatma engellendi"));

            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // 10 saniyede bir yeni tavsiye üret
        setInterval(() => {
            const randomMsg = sentences[Math.floor(Math.random() * sentences.length)];
            document.getElementById('aiAdvice').innerText = `"${randomMsg}"`;
        }, 10000);

        async function verileriCek() {
            try {
                const response = await fetch('/api/price');
                const data = await response.json();

                const priceEl = document.getElementById('priceDisplay');
                priceEl.innerText = data.price.toFixed(2);
                
                document.getElementById('statHigh').innerText = data.stats.high;
                document.getElementById('statLow').innerText = data.stats.low;
                document.getElementById('statVol').innerText = data.stats.vol.toLocaleString() + ' AMT';

                // PUMP veya DUMP durumunda Bildirim Balonu Tetikleme
                if (data.state === 'PUMP' && lastState !== 'PUMP') {
                    showToast("🚀 YÜKSELİŞ BAŞLADI: Her şey artıyor, piyasayı izle!", "#26a69a");
                    priceEl.style.color = '#26a69a';
                    chart.data.datasets[0].borderColor = '#26a69a';
                } else if (data.state === 'DUMP' && lastState !== 'DUMP') {
                    showToast("⚠️ AYI PİYASASI: Ani çöküş, hemen sat o ametisti!", "#ef5350");
                    priceEl.style.color = '#ef5350';
                    chart.data.datasets[0].borderColor = '#ef5350';
                }

                if (data.state === 'STABLE') {
                    priceEl.style.color = '#ffffff';
                }

                lastState = data.state;
                chart.data.datasets[0].data = data.history;
                chart.update();
            } catch (err) {}
        }

        setInterval(verileriCek, 2000);
        verileriCek();
    </script>
</body>
</html>
